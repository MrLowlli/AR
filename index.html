<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="data:," />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <h1>Libro Bambuco realidad aumentada</h1>
    <p>Estamos organizando todo para que se vea perfecto en el preview</p>

    <a-scene mindar-image="imageTargetSrc: CasaCampesina.mind filterMinCF: 0.0001; filterBeta: 2000;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="danceModel" src="Dance_2_lowpo.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model src="#danceModel" position="0 -0.5 0" rotation="0 0 0" scale="0.7 0.7 0.7" animation-mixer="clip: *; loop: repeat"></a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
